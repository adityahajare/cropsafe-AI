<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Component Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        #map { height: 400px; width: 100%; margin: 10px 0; }
        .log { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🗺️ Map Component Test</h1>
    <p>This page tests if Leaflet maps work correctly in the browser environment.</p>
    
    <div class="test-container">
        <h2>Test 1: Basic Leaflet Map</h2>
        <div id="map"></div>
        <div id="map-status" class="log">Loading...</div>
    </div>
    
    <div class="test-container">
        <h2>Test 2: Nominatim Search</h2>
        <input type="text" id="search-input" placeholder="Enter city name (e.g., Mumbai)" style="padding: 8px; width: 200px;">
        <button onclick="testSearch()" style="padding: 8px 16px; margin-left: 8px;">Search</button>
        <div id="search-results" class="log">Enter a city name and click search</div>
    </div>
    
    <div class="test-container">
        <h2>Test 3: GPS Location</h2>
        <button onclick="testGPS()" style="padding: 8px 16px;">Get My Location</button>
        <div id="gps-results" class="log">Click button to test GPS</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Test 1: Basic Map
        function initMap() {
            try {
                const map = L.map('map').setView([18.52, 73.85], 13);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
                
                L.marker([18.52, 73.85]).addTo(map)
                    .bindPopup('Test marker in Nashik')
                    .openPopup();
                
                document.getElementById('map-status').innerHTML = '✅ Map loaded successfully!';
                document.getElementById('map-status').className = 'log success';
            } catch (error) {
                document.getElementById('map-status').innerHTML = '❌ Map failed to load: ' + error.message;
                document.getElementById('map-status').className = 'log error';
            }
        }
        
        // Test 2: Nominatim Search
        async function testSearch() {
            const query = document.getElementById('search-input').value;
            const resultsDiv = document.getElementById('search-results');
            
            if (!query) {
                resultsDiv.innerHTML = '❌ Please enter a city name';
                return;
            }
            
            resultsDiv.innerHTML = '🔍 Searching...';
            
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=3&countrycodes=in`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const results = await response.json();
                
                if (results.length === 0) {
                    resultsDiv.innerHTML = '❌ No results found for "' + query + '"';
                } else {
                    let html = '✅ Found ' + results.length + ' results:<br>';
                    results.forEach((result, index) => {
                        html += `${index + 1}. ${result.display_name}<br>`;
                        html += `   📍 ${parseFloat(result.lat).toFixed(4)}, ${parseFloat(result.lon).toFixed(4)}<br>`;
                    });
                    resultsDiv.innerHTML = html;
                    resultsDiv.className = 'log success';
                }
            } catch (error) {
                resultsDiv.innerHTML = '❌ Search failed: ' + error.message;
                resultsDiv.className = 'log error';
            }
        }
        
        // Test 3: GPS Location
        function testGPS() {
            const resultsDiv = document.getElementById('gps-results');
            
            if (!navigator.geolocation) {
                resultsDiv.innerHTML = '❌ Geolocation not supported';
                resultsDiv.className = 'log error';
                return;
            }
            
            resultsDiv.innerHTML = '📡 Getting location...';
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    resultsDiv.innerHTML = `✅ Location found:<br>📍 ${latitude.toFixed(6)}, ${longitude.toFixed(6)}<br>🎯 Accuracy: ${accuracy}m`;
                    resultsDiv.className = 'log success';
                },
                (error) => {
                    resultsDiv.innerHTML = '❌ Location error: ' + error.message;
                    resultsDiv.className = 'log error';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
        
        // Initialize map when page loads
        window.onload = initMap;
    </script>
</body>
</html>
